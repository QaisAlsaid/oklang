name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# a newer push to the same branch replaces the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            cmake-flags: '-DCMAKE_BUILD_TYPE=Release'
          - name: asan
            cmake-flags: '-DCMAKE_BUILD_TYPE=Release -DOK_ENABLE_SANITIZERS=ON'
          - name: coverage
            cmake-flags: '-DCMAKE_BUILD_TYPE=Coverage'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: configure
        run: cmake -S . -B build -DOK_BUILD_TESTS=ON ${{ matrix.cmake-flags }}

      - name: build
        run: cmake --build build --parallel

      - name: unit tests
        run: ctest --test-dir build --output-on-failure

      - name: e2e tests
        working-directory: build
        run: ./tests/e2e/oktest-e2e-runner ./ok ../tests/e2e/tests/

      - name: embedding test
        run: ./build/tests/integration/embedding/oktest_embedding

      - name: upload coverage to codecov
        if: ${{ matrix.name == 'coverage' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  report:
    name: report to codeberg
    runs-on: ubuntu-latest
    needs: [build-test]
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: post commit status
        env:
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CB_REPO: ${{ vars.CODEBERG_REPO }}
          RESULT: ${{ needs.build-test.result }}
        run: |
          # no token configured: keep the run green, skip the cross-post
          if [ -z "$CB_TOKEN" ]; then
            echo 'CODEBERG_TOKEN not set — skipping status posting'
            exit 0
          fi
          case "$RESULT" in
            success) state='success'; desc='ci green (plain + asan + coverage)' ;;
            *)       state='failure'; desc="ci $RESULT (plain + asan + coverage)" ;;
          esac
          curl -sf -X POST \
            -H "Authorization: token $CB_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"state\":\"$state\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"$desc\",\"context\":\"ci/github-actions\"}" \
            "https://codeberg.org/api/v1/repos/$CB_REPO/statuses/${{ github.sha }}"

